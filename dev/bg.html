<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Background plates viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #101014; color: #c9c9d2; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  canvas { display: block; margin: 0 auto; width: 1280px; max-width: 100vw; aspect-ratio: 16 / 9; image-rendering: pixelated; }
  #hud { text-align: center; padding: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script src="../js/core.js"></script>
<script src="../js/backgrounds.js"></script>
<script>
  // ?s=<scene>&x=<camX>&z=<zoom>&dark=&flash=&ghost=&heat=&wind=&pan=1&hd=1   keys 1-7 switch scene, P toggles pan
  const q = new URLSearchParams(location.search);
  const names = ['hill', 'garden', 'ink', 'lobby', 'theater', 'house', 'street'];
  const num = (k) => parseFloat(q.get(k)) || 0;
  let name = names.includes(q.get('s')) ? q.get('s') : 'hill';
  let pan = q.get('pan') === '1';
  const hd = q.get('hd') === '1';                       // hd=1: full resolution; default: the game's 480x270 pixel framebuffer
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const ps = hd ? Math.min(window.devicePixelRatio || 1, 2) : 0.375;
  cv.width = Math.round(1280 * ps); cv.height = Math.round(720 * ps);
  if (hd) cv.style.imageRendering = 'auto';
  const st = { t: 0, dark: num('dark'), flash: num('flash'), ghost: num('ghost'), heat: num('heat'), wind: num('wind') };
  const zoom = num('z') || 1;
  function sil(x, h, w) {
    ctx.fillStyle = '#14121a';
    ctx.beginPath(); ctx.ellipse(x, -h + w * 0.42, w * 0.42, w * 0.42, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - w * 0.36, 0); ctx.lineTo(x - w * 0.42, -h + w * 0.9); ctx.quadraticCurveTo(x, -h + w * 0.6, x + w * 0.42, -h + w * 0.9); ctx.lineTo(x + w * 0.36, 0); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x, 2, w * 0.6, 6, 0, 0, 6.2832); ctx.fill();
  }
  let last = performance.now(), ms = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; st.t += dt;
    const bg = BD.Backgrounds[name], half = 640 / zoom;
    let x = q.has('x') ? num('x') : bg.width / 2;
    if (pan) x = half + (bg.width - 2 * half) * (0.5 - 0.5 * Math.cos(st.t * 0.25));
    x = Math.max(half, Math.min(bg.width - half, x));
    BD.cam.x = x; BD.cam.y = 0; BD.cam.zoom = zoom;
    const t0 = performance.now();
    ctx.setTransform(ps, 0, 0, ps, 0, 0);
    bg.draw(ctx, BD.cam, st);
    BD.cam.push(ctx, 1);
    sil(x - 110, 150, 62); sil(x + 110, 190, 74);
    if (bg.platforms[0]) { const p = bg.platforms[0]; sil((p.x1 + p.x2) / 2, 150 - p.y, 62); }
    BD.cam.pop(ctx);
    bg.drawFront(ctx, BD.cam, st);
    ms = ms * 0.95 + (performance.now() - t0) * 0.05;
    document.getElementById('hud').textContent = `${name}  width ${bg.width}  camX ${x.toFixed(0)}  zoom ${zoom}  draw ${ms.toFixed(2)} ms  |  keys 1-7 scene, P pan  |  ?s= x= z= dark= flash= ghost= heat= wind= pan=1 hd=1`;
  }
  addEventListener('keydown', (e) => {
    const i = '1234567'.indexOf(e.key);
    if (i >= 0) name = names[i];
    if (e.key === 'p' || e.key === 'P') pan = !pan;
  });
  requestAnimationFrame(frame);
</script>
</body>
</html>
